# pyproject.toml

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "antiphoria-slop-research-factory"
version = "0.1.0"
description = "Generator–Verifier–Reviser research factory with cryptographic provenance (slop-cli)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "litellm>=1.40.0",
    "instructor>=1.3.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "anyio>=4.4.0",
    "filelock>=3.12.0",
    "langgraph>=0.2.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
# Local sealing SDK: sibling repo …/antiphoria-slop-provenance (see [tool.uv.sources]).
# `uv lock` / `uv sync` resolve the path. Plain `pip install .[provenance]` does not read
# uv sources — install the SDK first: `pip install -e ../antiphoria-slop-provenance`.
provenance = [
    "antiphoria-slop-provenance>=0.3.0",
]
dev = [
    "ruff>=0.5.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-timeout>=2.3.0",
    "mypy>=1.10.0",
]
eval = [
    "matplotlib>=3.9.0",
]
production = [
    "arq>=0.26.0",
    "redis>=5.0.0",
    "streamlit>=1.35.0",
]

[project.scripts]
slop-factory = "slop_research_factory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
antiphoria-slop-provenance = { path = "../antiphoria-slop-provenance", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 60

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
no_implicit_optional = true
show_error_codes = true
pretty = true